name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest requests
      - name: Byte-compile the scripts
        run: python -m compileall -q *.py tools
      - name: Run unit tests
        run: python -m pytest tests -v
